<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CI Pro Calculator</title>
  <style>
  :root {
  --bg-gradient: linear-gradient(180deg, #fdfdfd 0%, #f4f4f7 100%);
  --card-bg: #ffffffdd; /* translucent white */
  --card-shadow: 0 8px 20px rgba(0,0,0,0.08);
  --rainbow-gradient: linear-gradient(90deg,
    #ff5f6d,
    #ffc371,
    #47cf73,
    #32a6ff,
    #9b5de5
  );
  --text-main: #1c1c1e;
  --text-subtle: #6e6e73;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen;
  background: var(--bg-gradient);
  color: var(--text-main);
  margin: 0;
}

.sticky-header {
  background: transparent;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 25px 15px 10px;
  border-bottom: 0;
  box-shadow: none;
}

h1 {
  font-size: 1.6rem;
  font-weight: 600;
  text-align: center;
  margin: 0 0 12px 0;
  background: var(--rainbow-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.progress-bar {
  height: 8px;
  border-radius: 999px;
  background: #e5e5ea;
  overflow: hidden;
}

.progress-fill {
  background: var(--rainbow-gradient);
  transition: width 0.4s ease;
}


    .step-tracker {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--inactive-color);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .label {
      font-size: 0.8rem;
      text-align: center;
    }

    .step.active .circle {
      background: var(--main-color);
    }

    .step.active .label {
      color: var(--main-color);
    }

    .step.dimmed .circle {
      background: var(--dimmed-color);
    }

    .step.dimmed .label {
      color: var(--dimmed-color);
    }

    .divider {
      height: 2px;
      background-color: var(--inactive-color);
      flex: 0.5;
      margin: 0 4px;
    }

    .content-section {
      padding: 20px;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

.content-section {
  max-width: 480px;
  margin: 20px auto;
  background: var(--card-bg);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-radius: 24px;
  padding: 25px;
  box-shadow: var(--card-shadow);
}

    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="number"],
input[type="text"] {
  border-radius: 12px;
  border: 1px solid #d1d1d6;
  padding: 12px;
  font-size: 1rem;
  background: #f9f9fb;
  transition: border 0.2s, box-shadow 0.2s;
}

input:focus {
  outline: none;
  border: 1px solid transparent;
  background: white;
  box-shadow: 0 0 0 2px #007aff44;
}
    .button-group {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
  background: var(--rainbow-gradient);
  border: none;
  padding: 12px 20px;
  border-radius: 999px;
  color: white;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.2s ease, opacity 0.2s ease;
}


    button:hover {
  transform: translateY(-2px);
  opacity: 0.9;
}

    .result-card {
  margin-top: 20px;
  padding: 30px;
  border-radius: 28px;
  background: var(--card-bg);
  backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.12);
  text-align: center;
}

.result-card h3 {
  font-size: 1.2rem;
  font-weight: 500;
  color: var(--text-subtle);
  margin-bottom: 15px;
}

.result-amount {
  font-size: 2rem;
  font-weight: 700;
  background: var(--rainbow-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}

.result-breakdown {
  font-size: 0.95rem;
  color: var(--text-subtle);
  line-height: 1.5;
}

    @media (max-width: 600px) {
      h1 {
        font-size: 1.2rem;
      }
      .circle {
        width: 26px;
        height: 26px;
        font-size: 0.8rem;
      }
      .label {
        font-size: 0.7rem;
      }
      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <div class="sticky-header">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <h1>CI Pro Calculator</h1>
    <div class="step-tracker">
      <div class="step active" id="step-1">
        <div class="circle">1</div>
        <div class="label">Income</div>
      </div>
      <div class="divider"></div>
      <div class="step dimmed" id="step-2">
        <div class="circle">2</div>
        <div class="label">Medical</div>
      </div>
      <div class="divider"></div>
      <div class="step dimmed" id="step-3">
        <div class="circle">3</div>
        <div class="label">Summary</div>
      </div>
    </div>
  </div>

  <div class="content-section" id="section-1">
    <h2>Step 1: Income Replacement</h2>
    <div class="form-group">
      <label for="monthlyIncome">Monthly Income (RM)</label>
      <input type="number" id="monthlyIncome" placeholder="e.g. 5000" />
    </div>
    <div class="form-group">
      <label for="yearsToReplace">Years to Replace</label>
      <input type="number" id="yearsToReplace" placeholder="e.g. 5" />
    </div>
    <div class="button-group">
      <button onclick="goToStep(2)">Next</button>
    </div>
  </div>

  <div class="content-section hidden" id="section-2">
    <h2>Step 2: Medical Expenses</h2>
    <div class="form-group">
      <label for="hospitalCost">Expected Hospital Cost (RM)</label>
      <input type="number" id="hospitalCost" placeholder="e.g. 100000" />
    </div>
    <div class="form-group">
      <label for="recoveryCost">Recovery Support Cost (RM)</label>
      <input type="number" id="recoveryCost" placeholder="e.g. 30000" />
    </div>
    <div class="button-group">
      <button onclick="goToStep(1)">Back</button>
      <button onclick="goToStep(3)">Next</button>
    </div>
  </div>

  <div class="content-section hidden" id="section-3">
    <h2>Step 3: Total Summary</h2>
    <p id="result"></p>
    <div class="button-group">
      <button onclick="goToStep(2)">Back</button>
      <button onclick="location.reload()">Reset</button>
    </div>
  </div>

  <script>
    function goToStep(step) {
      const steps = [1, 2, 3];

      steps.forEach(s => {
        const stepEl = document.getElementById(`step-${s}`);
        const sectionEl = document.getElementById(`section-${s}`);

        if (s === step) {
          stepEl.classList.add('active');
          stepEl.classList.remove('dimmed');
          sectionEl.classList.remove('hidden');
          sectionEl.classList.add('fade-in');
          setTimeout(() => {
            sectionEl.scrollIntoView({ behavior: 'smooth' });
          }, 100);
        } else {
          stepEl.classList.remove('active');
          if (s < step) {
            stepEl.classList.remove('dimmed');
          } else {
            stepEl.classList.add('dimmed');
          }
          sectionEl.classList.add('hidden');
          sectionEl.classList.remove('fade-in');
        }
      });

      // Progress bar update
      const fill = document.getElementById('progress-fill');
      const percent = ((step - 1) / 2) * 100;
      fill.style.width = percent + '%';

      // Show results on step 3
      if (step === 3) {
        const income = parseFloat(document.getElementById("monthlyIncome").value) || 0;
        const years = parseFloat(document.getElementById("yearsToReplace").value) || 0;
        const hospital = parseFloat(document.getElementById("hospitalCost").value) || 0;
        const recovery = parseFloat(document.getElementById("recoveryCost").value) || 0;

        const totalIncome = income * 12 * years;
        const totalMedical = hospital + recovery;
        const total = totalIncome + totalMedical;

        document.getElementById("result").innerHTML = `
  <strong>Total Income Replacement:</strong> RM ${totalIncome.toLocaleString()}<br>
  <strong>Total Medical Expenses:</strong> RM ${totalMedical.toLocaleString()}<br>
  <strong><u>Recommended CI Coverage:</u></strong> <b>RM ${total.toLocaleString()}</b>
`;
      }
    }
  </script>

</body>
</html>
