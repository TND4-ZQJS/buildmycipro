
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CI Pro Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      padding-top: 100px;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      z-index: 1000;
    }
    .step-indicator {
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .step {
      display: flex;
      align-items: center;
      margin: 0 10px;
      opacity: 0.4;
      transition: opacity 0.3s;
    }
    .step.active {
      opacity: 1;
    }
    .circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #007aff;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 10px;
    }
    .step-label {
      font-size: 14px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .step-section {
      display: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .step-section.active {
      display: block;
      opacity: 1;
    }
    .btn-group {
      margin-top: 20px;
      text-align: right;
    }
    button {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    @media (max-width: 600px) {
      .step-label {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="step-indicator">
      <div class="step active" data-step="1">
        <div class="circle">1</div>
        <div class="step-label">Income Replacement</div>
      </div>
      <div class="step" data-step="2">
        <div class="circle">2</div>
        <div class="step-label">Medical Expenses</div>
      </div>
      <div class="step" data-step="3">
        <div class="circle">3</div>
        <div class="step-label">Summary</div>
      </div>
    </div>
  </header>

  <div class="container">
    <section class="step-section active" id="step1">
      <h2>Step 1: Income Replacement</h2>
      <p>Enter your income details:</p>
      <input type="number" placeholder="Monthly income (MYR)" style="width:100%; padding:10px; margin-top:10px;" />
      <div class="btn-group">
        <button onclick="nextStep()">Next</button>
      </div>
    </section>

    <section class="step-section" id="step2">
      <h2>Step 2: Medical Expenses</h2>
      <p>Enter your expected medical costs:</p>
      <input type="number" placeholder="Estimated cost (MYR)" style="width:100%; padding:10px; margin-top:10px;" />
      <div class="btn-group">
        <button onclick="prevStep()">Back</button>
        <button onclick="nextStep()">Next</button>
      </div>
    </section>

    <section class="step-section" id="step3">
      <h2>Summary</h2>
      <p>Your calculated CI Pro needs will be shown here.</p>
      <div class="btn-group">
        <button onclick="prevStep()">Back</button>
      </div>
    </section>
  </div>

  <script>
    let currentStep = 1;

    function updateSteps() {
      document.querySelectorAll(".step").forEach((el, index) => {
        el.classList.toggle("active", index + 1 === currentStep);
      });

      document.querySelectorAll(".step-section").forEach((section, index) => {
        section.classList.remove("active");
        if (index + 1 === currentStep) {
          section.classList.add("active");
        }
      });
    }

    function nextStep() {
      if (currentStep < 3) {
        currentStep++;
        updateSteps();
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        updateSteps();
      }
    }
  </script>
</body>
</html>
