<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CI Pro Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #333;
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: #fff;
      border-right: 1px solid #eee;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 0;
    }
    .sidebar .menu {
      display: flex;
      flex-direction: column;
    }
    .menu-item {
      padding: 15px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #555;
      transition: background 0.2s;
    }
    .menu-item:hover,
    .menu-item.active {
      background: #e6f4ea;
      color: #007a33;
      font-weight: 600;
    }

    /* Main area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .topbar {
      height: 60px;
      background: #fff;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar h1 {
      font-size: 18px;
      font-weight: 600;
    }

    /* Dashboard content layout */
    .content {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      display: none;
    }
    .card.active {
      display: block;
    }

    .summary {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: sticky;
      top: 80px;
      height: fit-content;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 10px;
    }

    .btn {
      margin-top: 20px;
      background: #007a33;
      color: #fff;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    @media (max-width: 900px) {
      .sidebar {
        display: none;
      }
      .content {
        grid-template-columns: 1fr;
      }
      .summary {
        position: relative;
        top: auto;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="menu">
      <div class="menu-item active" onclick="goStep(1)">💼 Income</div>
      <div class="menu-item" onclick="goStep(2)">🏥 Medical</div>
      <div class="menu-item" onclick="goStep(3)">📊 Summary</div>
    </div>
    <div class="menu">
      <div class="menu-item">⚙️ Settings</div>
      <div class="menu-item">❓ Help</div>
      <div class="menu-item">🚪 Logout</div>
    </div>
  </div>

  <!-- Main area -->
  <div class="main">
    <!-- Top bar -->
    <div class="topbar">
      <h1>CI Pro Calculator</h1>
      <div>👤 Profile</div>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- Step cards -->
      <div>
        <div class="card active" id="step1">
          <h2>Step 1: Income Replacement</h2>
          <input type="number" id="income" placeholder="Monthly income (MYR)" />
          <button class="btn" onclick="goStep(2)">Next</button>
        </div>
        <div class="card" id="step2">
          <h2>Step 2: Medical Expenses</h2>
          <input type="number" id="medical" placeholder="Estimated medical cost (MYR)" />
          <button class="btn" onclick="goStep(3)">Next</button>
        </div>
        <div class="card" id="step3">
          <h2>Step 3: Summary</h2>
          <p>Check results in the right panel.</p>
          <button class="btn" onclick="goStep(1)">Back to Start</button>
        </div>
      </div>

      <!-- Right summary panel -->
      <div class="summary">
        <h3>Your Summary</h3>
        <p><strong>Income:</strong> <span id="sumIncome">-</span></p>
        <p><strong>Medical:</strong> <span id="sumMedical">-</span></p>
        <p><strong>Total Need:</strong> <span id="sumTotal">-</span></p>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;

    function goStep(step) {
      currentStep = step;
      document.querySelectorAll(".card").forEach((c, i) => {
        c.classList.toggle("active", i+1 === step);
      });
      document.querySelectorAll(".menu-item").forEach((m, i) => {
        if (i < 3) m.classList.toggle("active", i+1 === step);
      });
      updateSummary();
    }

    function updateSummary() {
      const income = parseFloat(document.getElementById("income").value) || 0;
      const medical = parseFloat(document.getElementById("medical").value) || 0;
      document.getElementById("sumIncome").textContent = income ? "MYR " + income.toLocaleString() : "-";
      document.getElementById("sumMedical").textContent = medical ? "MYR " + medical.toLocaleString() : "-";
      document.getElementById("sumTotal").textContent = (income+medical) ? "MYR " + (income+medical).toLocaleString() : "-";
    }

    document.getElementById("income").addEventListener("input", updateSummary);
    document.getElementById("medical").addEventListener("input", updateSummary);
  </script>
</body>
</html>
