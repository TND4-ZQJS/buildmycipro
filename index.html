<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: #ffffff;
      border-right: 1px solid #ddd;
      padding: 1rem;
      transition: transform 0.3s ease;
    }
    .sidebar h2 {
      margin-top: 0;
      font-size: 1.2rem;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
    }
    .sidebar ul li {
      padding: 0.8rem 0;
      cursor: pointer;
    }

    /* Main content */
    .main {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
    }

    /* Top bar */
    .topbar {
      display: none; /* only on mobile */
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      background: #fff;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .hamburger {
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Mobile styles */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
        z-index: 2000;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .topbar {
        display: flex;
      }
      .main {
        flex: 1;
        padding-top: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <h2>Menu</h2>
    <ul>
      <li>Dashboard</li>
      <li>Tasks</li>
      <li>Calendar</li>
      <li>Analytics</li>
      <li>Team</li>
    </ul>
  </nav>

  <!-- Top bar (mobile only) -->
  <div class="topbar">
    <span class="hamburger" id="hamburger">☰</span>
    <h2>Dashboard</h2>
  </div>

  <!-- Main content -->
  <main class="main">
    <h1>Welcome</h1>
    <p>This is your dashboard content.</p>
    <p>Resize the window to test sidebar behavior.</p>
  </main>

  <script>
    const sidebar = document.getElementById("sidebar");
    const hamburger = document.getElementById("hamburger");

    hamburger.addEventListener("click", () => {
      sidebar.classList.toggle("open");
    });
  </script>
</body>
</html>
