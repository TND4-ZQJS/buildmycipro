<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CI Pro Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #333;
    }

    /* Top header with steps */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      z-index: 1000;
      padding: 15px;
    }
    .steps {
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .step {
      display: flex;
      align-items: center;
      opacity: 0.4;
      transition: opacity 0.3s;
    }
    .step.active { opacity: 1; }
    .circle {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: #007aff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 8px;
    }

    /* Dashboard layout */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      padding: 120px 20px 40px; /* space for header */
      max-width: 1200px;
      margin: auto;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      display: none;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .card.active {
      display: block;
      opacity: 1;
    }

    .summary {
      position: sticky;
      top: 120px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .btn {
      margin-top: 20px;
      background: #007aff;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    @media (max-width: 800px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      .summary {
        position: relative;
        top: auto;
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="steps">
      <div class="step active" data-step="1"><div class="circle">1</div> Income</div>
      <div class="step" data-step="2"><div class="circle">2</div> Medical</div>
      <div class="step" data-step="3"><div class="circle">3</div> Summary</div>
    </div>
  </header>

  <main class="dashboard">
    <!-- Main form area -->
    <div>
      <div class="card active" id="step1">
        <h2>Step 1: Income Replacement</h2>
        <input type="number" id="income" placeholder="Monthly income (MYR)" />
        <button class="btn" onclick="nextStep()">Next</button>
      </div>
      <div class="card" id="step2">
        <h2>Step 2: Medical Expenses</h2>
        <input type="number" id="medical" placeholder="Estimated medical costs (MYR)" />
        <button class="btn" onclick="nextStep()">Next</button>
      </div>
      <div class="card" id="step3">
        <h2>Step 3: Summary</h2>
        <p>Results shown in right panel.</p>
        <button class="btn" onclick="prevStep()">Back</button>
      </div>
    </div>

    <!-- Sidebar summary -->
    <div class="summary">
      <h3>Your Summary</h3>
      <p><strong>Income:</strong> <span id="sumIncome">-</span></p>
      <p><strong>Medical:</strong> <span id="sumMedical">-</span></p>
      <p><strong>Total CI Pro Need:</strong> <span id="sumTotal">-</span></p>
    </div>
  </main>

  <script>
    let currentStep = 1;

    function updateSteps() {
      document.querySelectorAll(".step").forEach((el, i) => {
        el.classList.toggle("active", i+1 === currentStep);
      });
      document.querySelectorAll(".card").forEach((el, i) => {
        el.classList.remove("active");
        if (i+1 === currentStep) el.classList.add("active");
      });
      updateSummary();
    }

    function nextStep() {
      if (currentStep < 3) {
        currentStep++;
        updateSteps();
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        updateSteps();
      }
    }

    function updateSummary() {
      const income = parseFloat(document.getElementById("income").value) || 0;
      const medical = parseFloat(document.getElementById("medical").value) || 0;
      document.getElementById("sumIncome").textContent = income ? "MYR " + income.toLocaleString() : "-";
      document.getElementById("sumMedical").textContent = medical ? "MYR " + medical.toLocaleString() : "-";
      document.getElementById("sumTotal").textContent = (income+medical) ? "MYR " + (income+medical).toLocaleString() : "-";
    }

    document.getElementById("income").addEventListener("input", updateSummary);
    document.getElementById("medical").addEventListener("input", updateSummary);
  </script>
</body>
</html>
